<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Timekeeper iPhone</title>
  <meta name="description" content="放送・イベント進行向けタイムキープアプリ" />
  <meta name="theme-color" content="#06060e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Timekeeper" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  
  <!-- Tailwind CSS (静的生成済み) -->
  <link rel="stylesheet" href="./styles.css" />
  
  <!-- React 18 (ローカル同梱: react.production.min.js 18.3.1 / 第2段でCDNから移行) -->
  <script src="./react.production.min.js"></script>
  <script src="./react-dom.production.min.js"></script>

  <!-- SortableJS 1.15.0 (ローカル同梱) -->
  <script src="./sortable.min.js"></script>

  <!-- フォント (ローカル同梱: Share Tech Mono / Rajdhani) -->
  <link rel="stylesheet" href="./fonts.css" />


  <style>
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #06060e;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #root {
      position: absolute;
      inset: 0;
      height: 100%;
      /* 上下のセーフエリアは、ヘッダーと最下部の帯がそれぞれ背景ごと取り込む（v10）。
         ここで padding を付けると、その分だけ表示範囲が狭くなる */
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      box-sizing: border-box;
    }
    /* 背の低い画面（iPhone SEなど）では上下の固定部分を少し詰めて、表示範囲を確保する */
    @media (max-height: 700px) {
      .tk-tab-btn { height: 42px !important; }
      .tk-tab-pill { height: 42px !important; }
      .tk-strip { height: calc(34px + max(0px, calc(env(safe-area-inset-bottom, 0px) - 12px))) !important; }
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #22223a;
      border-radius: 2px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* タブ切り替え時の画面アニメーション（右隣のタブへ=右から、左隣のタブへ=左から） */
    @keyframes tabInFromRight {
      from { opacity: 0; transform: translateX(28px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes tabInFromLeft {
      from { opacity: 0; transform: translateX(-28px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .sortable-ghost {
      opacity: 0.25;
      background-color: #0c0c16 !important;
      border: 1px dashed #f0a030 !important;
    }
    .sortable-chosen {
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.85), 0 0 16px rgba(240,160,48,0.3) !important;
      transform: scale(1.02);
      background-color: rgba(240,160,48,0.12) !important;
      border-color: #f0a030 !important;
      z-index: 50;
    }

    /* iPhone SE / 小画面端末向け 微調整 */
    @media (max-height: 700px), (max-width: 380px) {
      .cd-card-h {
        height: 74px !important;
      }
      .tm-card-h {
        height: 76px !important;
      }
      .font-cd-digits {
        font-size: clamp(26px, 8.5vw, 36px) !important;
      }
      .font-tm-digits {
        font-size: clamp(28px, 9.5vw, 40px) !important;
      }
      .font-header-clock {
        font-size: clamp(28px, 8vw, 34px) !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./app.js"></script>
  <script>
    // Service Worker（オフライン対応）: https または localhost でのみ有効
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
